<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Kajal Tiwari — Full-stack developer</title>
  <desc id="desc">Thoughtful interfaces. Connected systems. React, Next.js, TypeScript, and AI. Neon paths connect three interface, API, and data panels, showing the journey from a product idea to a working application.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" stroke="#6C75A0" stroke-opacity=".065"/></pattern>
    <linearGradient id="rim" x1="25" y1="1" x2="972" y2="358" gradientUnits="userSpaceOnUse"><stop stop-color="#7851D2" stop-opacity=".45"/><stop offset=".5" stop-color="#CBD4E5"/><stop offset="1" stop-color="#007F93" stop-opacity=".4"/></linearGradient>
    <linearGradient id="route" x1="760" y1="109" x2="840" y2="258" gradientUnits="userSpaceOnUse"><stop stop-color="#7851D2"/><stop offset="1" stop-color="#007F93"/></linearGradient>
    <radialGradient id="ambient"><stop stop-color="#7851D2" stop-opacity=".09"/><stop offset="1" stop-color="#7851D2" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="1" y="1" width="998" height="358" rx="24"/></clipPath>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .flow{stroke-dasharray:14 86;stroke-dashoffset:100;animation:travel 4.6s linear infinite}
      .flow2{animation-delay:-2.3s}
      .status{animation:breath 3.6s ease-in-out infinite}
      @keyframes travel{to{stroke-dashoffset:0}}
      @keyframes breath{0%,100%{opacity:.5}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.flow,.status{animation:none}.flow{stroke-dasharray:none;opacity:.5}}
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="358" rx="24" fill="#F6F8FC" stroke="url(#rim)"/>
  <g clip-path="url(#clip)">
    <path d="M616 1H999V359H616Z" fill="url(#grid)"/>
    <ellipse cx="790" cy="170" rx="245" ry="205" fill="url(#ambient)"/>
    <path d="M613 43V317" stroke="#CFD7E7" stroke-dasharray="2 8"/>
    <path d="M51 41H70M930 319H949" stroke="#7851D2" stroke-opacity=".65" stroke-width="2" stroke-linecap="round"/>
    <circle class="status" cx="56" cy="64" r="3" fill="#007F93"/>
    <text x="70" y="68" fill="#576680" font-size="10" font-weight="600" letter-spacing="1.7">DESIGNED TO WORK. BUILT TO CONNECT.</text>
    <text x="49" y="144" fill="#18233C" font-size="64" font-weight="700" letter-spacing="-3.2">Kajal Tiwari<tspan fill="#7851D2">.</tspan></text>
    <text x="52" y="183" fill="#7851D2" font-size="23" font-weight="500" letter-spacing="-.4">Full-stack developer.</text>
    <text x="52" y="220" fill="#576680" font-size="16">Thoughtful interfaces. Connected systems.</text>
    <path d="M52 252H561" stroke="#CFD7E7"/>
    <text x="52" y="285" fill="#576680" font-size="12" class="mono">React</text>
    <circle cx="106" cy="281" r="1.5" fill="#77849A"/>
    <text x="122" y="285" fill="#576680" font-size="12" class="mono">Next.js</text>
    <circle cx="190" cy="281" r="1.5" fill="#77849A"/>
    <text x="207" y="285" fill="#576680" font-size="12" class="mono">TypeScript</text>
    <circle cx="300" cy="281" r="1.5" fill="#77849A"/>
    <text x="317" y="285" fill="#576680" font-size="12" class="mono">AI</text>
    <path d="M530 277L535 281L530 285M550 277L545 281L550 285" stroke="#007F93" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M683 84H649V179H713M944 179H956V275H905" stroke="#CFD7E7" stroke-width="1.2"/>
    <path d="M789 113V126Q789 134 797 134H825Q833 134 833 142V151M833 209V221Q833 229 825 229H779Q771 229 771 237V249" stroke="url(#route)" stroke-opacity=".4" stroke-width="1.5"/>
    <path class="flow" d="M789 113V126Q789 134 797 134H825Q833 134 833 142V151" pathLength="100" stroke="#7851D2" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)" opacity=".46"/>
    <path class="flow flow2" d="M833 209V221Q833 229 825 229H779Q771 229 771 237V249" pathLength="100" stroke="#007F93" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)" opacity=".46"/>
    <circle cx="649" cy="84" r="3" fill="#F6F8FC" stroke="#7851D2" stroke-opacity=".5"/>
    <circle cx="956" cy="275" r="3" fill="#F6F8FC" stroke="#007F93" stroke-opacity=".5"/>

    <rect x="666" y="55" width="248" height="58" rx="12" fill="#FFFFFF" stroke="#CBD4E5"/>
    <rect x="680" y="69" width="30" height="30" rx="8" fill="#EFF3FA"/>
    <rect x="687" y="77" width="16" height="13" rx="2" stroke="#7851D2" stroke-width="1.4"/><path d="M687 81H703" stroke="#7851D2" stroke-width="1.2"/>
    <text x="723" y="80" fill="#18233C" font-size="13" font-weight="600">Interface</text>
    <text x="723" y="98" fill="#576680" font-size="10" class="mono">where ideas take shape</text>
    <circle cx="892" cy="76" r="2.5" fill="#7851D2"/>

    <rect x="720" y="151" width="224" height="58" rx="12" fill="#FFFFFF" stroke="#CBD4E5"/>
    <rect x="734" y="165" width="30" height="30" rx="8" fill="#EFF3FA"/>
    <path d="M744 174L739 180L744 186M754 174L759 180L754 186M751 172L747 188" stroke="#007F93" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="777" y="176" fill="#18233C" font-size="13" font-weight="600">API + AI</text>
    <text x="777" y="194" fill="#576680" font-size="10" class="mono">logic with a purpose</text>
    <circle class="status" cx="923" cy="172" r="2.5" fill="#007F93"/>

    <rect x="648" y="249" width="256" height="58" rx="12" fill="#FFFFFF" stroke="#CBD4E5"/>
    <rect x="662" y="263" width="30" height="30" rx="8" fill="#EFF3FA"/>
    <ellipse cx="677" cy="272" rx="7" ry="3" stroke="#007F93" stroke-width="1.3"/>
    <path d="M670 272V283C670 287 684 287 684 283V272M670 278C670 282 684 282 684 278" stroke="#007F93" stroke-width="1.3"/>
    <text x="705" y="274" fill="#18233C" font-size="13" font-weight="600">Data</text>
    <text x="705" y="292" fill="#576680" font-size="10" class="mono">a foundation that lasts</text>
    <circle cx="882" cy="270" r="2.5" fill="#007F93"/>
  </g>
</svg>
